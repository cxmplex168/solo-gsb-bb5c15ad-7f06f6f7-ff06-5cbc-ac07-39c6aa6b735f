services:
  balancer:
    build: .
    image: reaction-balancer:latest
    container_name: reaction-balancer
    ports:
      # 宿主机端口可通过环境变量 BALANCER_PORT 覆盖，默认 8000
      - "${BALANCER_PORT:-8000}:8000"
    environment:
      # 容器内固定监听 8000；如需改动需同步调整 Dockerfile EXPOSE
      - APP_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
